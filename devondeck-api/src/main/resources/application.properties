# ============================================================
#  DevOnDeck API – Configuration Spring Boot
#  NE PAS commiter ce fichier s'il contient un vrai mot de passe.
#  Utilise la variable d'environnement DB_PASSWORD.
# ============================================================

spring.application.name=devondeck-api
server.port=8080

# --- Base de données PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/devondeck
spring.datasource.username=postgres
# Définis la variable d'environnement DB_PASSWORD dans ton système
# ou remplace ${DB_PASSWORD} par ton mot de passe UNIQUEMENT en local
# et ne le commite JAMAIS.
spring.datasource.password=postgres

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
